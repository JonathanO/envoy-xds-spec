[versions]
envoy-api = "1.36.0" # the oldest Envoy release upstream supports; users bring their own
errorprone = "2.51.0"
grpc = "1.85.1"
junit = "6.1.3"
protobuf = "4.36.2"

[libraries]
assertj = "org.assertj:assertj-core:3.27.7"
awaitility = "org.awaitility:awaitility:4.3.0"
envoy-api = { module = "net.woaf.jono.envoy:envoy-api", version.ref = "envoy-api" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
gson = "com.google.code.gson:gson:2.14.0"
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
guava = "com.google.guava:guava:33.7.2-jre"
hamcrest = "org.hamcrest:hamcrest:3.0"
hegel = "dev.hegel:hegel:0.10.4" # the differential fuzzer, in fuzz/
jspecify = "org.jspecify:jspecify:1.0.1"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
logback-classic = "ch.qos.logback:logback-classic:1.6.6"
nullaway = "com.uber.nullaway:nullaway:0.14.3"
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
slf4j-api = "org.slf4j:slf4j-api:2.0.20"
spotbugs-annotations = "com.github.spotbugs:spotbugs-annotations:4.10.5"
testcontainers = "org.testcontainers:testcontainers:2.0.5"

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
