name: "Conformance harness"

on:
  pull_request:
  push:
    branches:
      - main

# Builds the harness and runs its unit tests. Each port's CI runs the suite against real Envoys.
jobs:
  build:
    name: "Build & Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: conformance
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: "Check"
        run: ./gradlew check javadoc --console=plain
      - name: "Upload reports"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: conformance/build/reports/
